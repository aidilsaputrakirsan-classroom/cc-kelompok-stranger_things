version: "3.9"

services:
  auth-service:
    environment:
      - ENV=development
      - DEBUG=true
    volumes:
      - ./services/auth-service:/app

  item-service:
    environment:
      - ENV=development
      - DEBUG=true
    volumes:
      - ./services/item-service:/app

  frontend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app